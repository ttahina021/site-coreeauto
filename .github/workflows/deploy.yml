name: Déploiement coreeauto.mg

# Chaque push sur main est vérifié puis envoyé sur le serveur.
# On peut aussi le lancer à la main : onglet Actions > Déploiement coreeauto.mg > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jamais deux déploiements en même temps
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FTP_SERVER: web2.simafri.cloud
  SITE_URL: https://coreeauto.mg

jobs:
  verifier:
    name: Vérifier le code PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Syntaxe PHP (php -l)
        run: |
          erreurs=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || erreurs=1
          done < <(find site -name '*.php' -print0)
          exit $erreurs

      - name: Aucun secret dans le dépôt
        run: |
          for f in site/includes/db-config.php site/includes/mail-config.php; do
            if [ -e "$f" ]; then
              echo "::error::$f ne doit jamais être dans le dépôt."
              exit 1
            fi
          done

  deployer:
    name: Envoyer sur coreeauto.mg
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coreeauto.mg
    steps:
      - name: Secrets FTP présents ?
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Ajoutez les secrets FTP_USERNAME et FTP_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      # Envoi incrémental : seuls les fichiers modifiés depuis le dernier déploiement partent.
      # Les fichiers qui ne viennent pas du dépôt (db-config.php, photos dans uploads/,
      # LISEZMOI.md…) ne sont jamais modifiés ni supprimés sur le serveur.
      - name: Envoi FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            includes/db-config.php
            includes/mail-config.php
            data/*.sqlite*
            uploads/*.jpg
            uploads/*.jpeg
            uploads/*.png
            uploads/*.webp
            uploads/*.gif
            LISEZMOI.md

      # mail-config.php (identifiants SMTP) est écrit à partir du secret SMTP_PASSWORD
      # et envoyé à part : il n'est jamais dans le dépôt ni suivi par la synchronisation,
      # donc jamais supprimé par un déploiement.
      - name: Configuration e-mail (mail-config.php)
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::Secret SMTP_PASSWORD absent : mail-config.php n'est pas envoyé (le site marche, sans e-mails)."
            exit 0
          fi
          fichier="$RUNNER_TEMP/mail-config.php"
          python3 - "$fichier" <<'PY'
          import os, sys
          def php(v):
              return "'" + v.replace("\\", "\\\\").replace("'", "\\'") + "'"
          contenu = "\n".join([
              "<?php",
              "// Généré par le déploiement GitHub Actions. Ne pas modifier sur le serveur.",
              "define('SMTP_HOST', 'mail.coreeauto.mg');",
              "define('SMTP_PORT', 587);",
              "define('SMTP_SECURE', 'tls');",
              "define('SMTP_USER', 'contact@coreeauto.mg');",
              "define('SMTP_PASS', " + php(os.environ["SMTP_PASSWORD"]) + ");",
              "define('MAIL_FROM', 'contact@coreeauto.mg');",
              "",
          ])
          open(sys.argv[1], "w", encoding="utf-8").write(contenu)
          PY
          curl -sS --fail --ssl-reqd --ftp-create-dirs -T "$fichier" \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER/${FTP_DIR%/}/includes/mail-config.php"
          rm -f "$fichier"
          echo "mail-config.php envoyé."

      - name: Contrôle du site en ligne
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$1"; }
          ok=1
          verifier() {
            obtenu=$(code "$1")
            if [[ " $2 " == *" $obtenu "* ]]; then echo "OK   $1 -> $obtenu"
            else echo "::error::$1 a répondu $obtenu (attendu : $2)"; ok=0; fi
          }
          verifier /                        "200"
          verifier /catalogue               "200"
          verifier /sitemap.xml             "200"
          verifier /robots.txt              "200"
          verifier /admin/login.php         "200"
          verifier /admin/                  "302"
          verifier /index.php               "301"
          verifier /includes/db-config.php  "403 404"
          verifier /includes/mail-config.php "403 404"
          verifier /.ftp-deploy-sync-state.json "403 404"

          # Redirections vers https://coreeauto.mg (sans www)
          redirige() {
            res=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$1")
            if [ "$res" = "301 $2" ]; then echo "OK   $1 -> $res"
            else echo "::error::$1 a répondu « $res » (attendu : 301 $2)"; ok=0; fi
          }
          redirige http://coreeauto.mg/          https://coreeauto.mg/
          redirige http://coreeauto.mg/catalogue https://coreeauto.mg/catalogue
          redirige https://www.coreeauto.mg/     https://coreeauto.mg/

          # Le sitemap ne doit contenir que des adresses https://coreeauto.mg
          plan=$(curl -s --max-time 20 "$SITE_URL/sitemap.xml")
          if echo "$plan" | grep -q '<loc>https://coreeauto.mg/' && ! echo "$plan" | grep -qE '<loc>http://|<loc>https://www\.'; then
            echo "OK   sitemap.xml : $(echo "$plan" | grep -c '<loc>') adresses en https://coreeauto.mg"
          else echo "::error::sitemap.xml contient des adresses qui ne sont pas en https://coreeauto.mg"; ok=0; fi
          [ $ok = 1 ]
