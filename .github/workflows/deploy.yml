name: Déploiement coreeauto.mg

# Chaque push sur main est vérifié puis envoyé sur le serveur.
# On peut aussi le lancer à la main : onglet Actions > Déploiement coreeauto.mg > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jamais deux déploiements en même temps
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FTP_SERVER: web2.simafri.cloud
  SITE_URL: http://coreeauto.mg

jobs:
  verifier:
    name: Vérifier le code PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none

      - name: Syntaxe PHP (php -l)
        run: |
          erreurs=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || erreurs=1
          done < <(find site -name '*.php' -print0)
          exit $erreurs

      - name: Aucun secret dans le dépôt
        run: |
          if [ -e site/includes/db-config.php ]; then
            echo "::error::site/includes/db-config.php ne doit jamais être dans le dépôt."
            exit 1
          fi

  deployer:
    name: Envoyer sur coreeauto.mg
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://coreeauto.mg
    steps:
      - name: Secrets FTP présents ?
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Ajoutez les secrets FTP_USERNAME et FTP_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Envoi incrémental : seuls les fichiers modifiés depuis le dernier déploiement partent.
      # Les fichiers qui ne viennent pas du dépôt (db-config.php, photos dans uploads/,
      # LISEZMOI.md…) ne sont jamais modifiés ni supprimés sur le serveur.
      - name: Envoi FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            includes/db-config.php
            data/*.sqlite*
            uploads/*.jpg
            uploads/*.jpeg
            uploads/*.png
            uploads/*.webp
            uploads/*.gif
            LISEZMOI.md

      - name: Contrôle du site en ligne
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL$1"; }
          ok=1
          verifier() {
            obtenu=$(code "$1")
            if [[ " $2 " == *" $obtenu "* ]]; then echo "OK   $1 -> $obtenu"
            else echo "::error::$1 a répondu $obtenu (attendu : $2)"; ok=0; fi
          }
          verifier /                        "200"
          verifier /catalogue               "200"
          verifier /sitemap.xml             "200"
          verifier /robots.txt              "200"
          verifier /index.php               "301"
          verifier /includes/db-config.php  "403 404"
          verifier /.ftp-deploy-sync-state.json "403 404"
          [ $ok = 1 ]
